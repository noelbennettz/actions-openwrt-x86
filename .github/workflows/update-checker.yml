name: Update_Checker

on:
  workflow_dispatch:
  schedule:
    # Monthly: the 30th at 00:00 UTC (GitHub cron is always UTC).
    # Note: February has no 30th, so no scheduled run happens that month.
    - cron: '0 0 30 * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        git clone https://github.com/openwrt/openwrt --filter=blob:none --depth=1 -b openwrt-25.12
        cd openwrt
        echo "SHA_01=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        cd

        git clone https://github.com/openwrt/packages --filter=blob:none --depth=1 -b openwrt-25.12
        cd packages
        echo "SHA_02=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        cd

        git clone https://github.com/openwrt/luci --filter=blob:none --depth=1 -b openwrt-25.12
        cd luci
        echo "SHA_03=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        cd

        git clone https://github.com/openwrt/routing --filter=blob:none --depth=1 -b openwrt-25.12
        cd routing
        echo "SHA_04=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        cd

        git clone https://github.com/openwrt/telephony --filter=blob:none --depth=1 -b openwrt-25.12
        cd telephony
        echo "SHA_05=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        cd

    - name: Show Commit Head and Combination Heads
      id: combHeader
      run: |
        echo "commitHash_All=\
          ${{steps.getHash.outputs.SHA_01}}\
          ${{steps.getHash.outputs.SHA_02}}\
          ${{steps.getHash.outputs.SHA_03}}\
          ${{steps.getHash.outputs.SHA_04}}\
          ${{steps.getHash.outputs.SHA_05}}" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v5
      with:
        path: .commitHash_All
        key: HEAD-${{ steps.combHeader.outputs.commitHash_All }}
   

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.combHeader.outputs.commitHash_All }} | tee .commitHash_All
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3

    - name: Remove old Releases
      env:
        GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
      run: |
        set -euo pipefail
        # Same policy as dev-drprasad/delete-older-releases: ignore drafts; keep the newest KEEP
        # releases, then delete (including tags) releases older than MAX_DAYS days or with fewer
        # than KEEP_MIN downloads, when both KEEP_MIN and MAX_DAYS are non-zero.
        REPO="${{ github.repository }}"
        KEEP=5
        KEEP_MIN=2
        MAX_DAYS=60
        RAW=$(gh api --paginate "repos/${REPO}/releases")
        DATA=$(echo "$RAW" | jq -s 'flatten(1)')
        COUNT=$(echo "$DATA" | jq 'length')
        if [ "${COUNT:-0}" -eq 0 ]; then
          echo "No releases."
          exit 0
        fi
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          tag=$(echo "$line" | jq -r '.tag')
          echo "Deleting release + tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
        done < <(echo "$DATA" | jq -c --argjson keep "$KEEP" --argjson kmin "$KEEP_MIN" --argjson md "$MAX_DAYS" '
          [.[] | select(.draft == false and (.published_at | type == "string"))]
          | sort_by(.published_at) | reverse
          | map({
              tag: .tag_name,
              published_at: .published_at,
              dl: ([.assets[]? | .download_count // 0] | add)
            })
          | .[$keep:]
          | map(. + { days: (((now - (.published_at | fromdateiso8601)) / 86400) | floor) })
          | map(select(.dl < $kmin or .days > $md))
          | .[]
        ')
        
    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        event-type: openwrt_source_update
