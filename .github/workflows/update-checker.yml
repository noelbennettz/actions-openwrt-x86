# File: .github/workflows/update-checker.yml
# Description: Source code update checker
#
# Third-party actions are pinned by full commit SHA (tag in the trailing
# comment); see the note at the top of build-openwrt.yml.
#
# Three jobs, so writing is scoped to the ones that need it:
#   check         reads upstream commit ids (contents: read)
#   dispatch      asks for a build (contents: write, only when something moved)
#   housekeeping  prunes runs and releases (actions: write, contents: write)
#
# The source list comes from the pinned tree itself (feeds.conf.default after
# diy-part1.sh), not from a table here; see the 'Get Commit Hash' step.
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    # Twice a month, on the 1st and the 15th at 00:00 UTC (GitHub cron is
    # always UTC). The old '30th of the month' schedule silently skipped
    # February, because that day does not exist there.
    - cron: '0 0 1,15 * *'

env:
  # Must match REPO_BRANCH in build-openwrt.yml: the Go toolchain of 25.12 is
  # required by the current passwall packages (see the README), and every
  # official feed below is cloned at this same branch.
  REPO_BRANCH: openwrt-25.12

permissions:
  contents: read

jobs:
  check:
    name: Compare upstream commits
    runs-on: ubuntu-24.04
    # Clones eight repositories, five of them from git.openwrt.org. 20 minutes
    # was enough for the GitHub mirrors, but do not let a slow upstream mirror
    # be the thing that stops the check.
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: main-repo

    # The source list is not hard-coded. Clone the pinned OpenWrt tree, let
    # diy-part1.sh add its feeds to feeds.conf.default exactly the way the build
    # does, then take every source from that file: a feed upstream adds, or a
    # URL/branch that changes, needs no second list to drift out of sync. The
    # clone URLs are the ones the build's 'feeds update' uses - git.openwrt.org
    # for the official feeds, not the GitHub mirrors, which lag behind and used
    # to dispatch a build for a commit the build would never have picked up.
    - name: Get Commit Hash
      id: getHash
      run: |
        set -euo pipefail
        git clone --filter=blob:none --depth=1 -b "$REPO_BRANCH" \
          https://github.com/openwrt/openwrt openwrt
        ( cd openwrt && bash ../main-repo/diy-part1.sh )

        # name<TAB>full sha, one line per source. Full SHAs, so the comparison
        # with SOURCES.txt (which records full SHAs) needs no prefix guessing.
        : > .commitHash_All
        record() {
          local name=$1 sha
          sha=$(git -C "$name" rev-parse HEAD)
          printf '%s\t%s\n' "$name" "$sha" >> .commitHash_All
          printf '%-18s %s\n' "$name" "$sha"
        }
        record openwrt

        # 'src-git name url[;branch]', the form feeds.conf.default and
        # diy-part1.sh use. Anything else would be cloned by 'feeds update' but
        # is not handled here, so fail instead of silently not watching it.
        while read -r kind name rest; do
          [ -n "${kind:-}" ] || continue
          case "$kind" in
            \#*) continue ;;
            src-git) ;;
            *) echo "::error::$kind lines are not supported by the update checker"; exit 1 ;;
          esac
          url=${rest%%;*}
          branch=''
          case "$rest" in
            *';'*) branch=${rest#*;} ;;
          esac
          if [ -n "$branch" ]; then
            git clone --filter=blob:none --depth=1 -b "$branch" "$url" "$name"
          else
            git clone --filter=blob:none --depth=1 "$url" "$name"
          fi
          record "$name"
        done < openwrt/feeds.conf.default
        cat .commitHash_All

    # A cache marker used to short-circuit this ("heads already seen -> nothing
    # moved"). That made a *failed* build unretryable: the release is written by
    # the build, so no release means no record of those heads, but the marker
    # said "seen" and the checker never dispatched again until upstream moved.
    # The comparison below is against the newest release's SOURCES.txt - what the
    # last published build actually compiled - and a missing release means
    # "build". One small download, and no state that can get stuck.
    - name: Decide whether anything moved
      id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # .commitHash_All ('name<TAB>full sha'), written by 'Get Commit Hash', is
        # the list the comparison walks.
        HEADS=$(awk -F'\t' '{ printf "%s=%s ", $1, substr($2, 1, 12) }' .commitHash_All)
        echo "heads: $HEADS"

        tag=$(gh api "repos/$GH_REPO/releases?per_page=1" --jq '.[0].tag_name // empty' || true)
        if [ -z "$tag" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "no release exists yet, so there is nothing to compare against: build once"
          exit 0
        fi

        if ! gh release download "$tag" -R "$GH_REPO" -p SOURCES.txt \
               -O "$RUNNER_TEMP/SOURCES.txt" --clobber; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "release $tag has no SOURCES.txt to compare with: build"
          exit 0
        fi

        changed=false
        while IFS=$'\t' read -r name sha; do
          [ -n "$name" ] || continue
          # SOURCES.txt: 'name ref commit url'
          recorded=$(awk -v n="$name" '$1 == n { print $3 }' "$RUNNER_TEMP/SOURCES.txt")
          if [ -z "$recorded" ]; then
            # A source the release does not record cannot be shown unchanged.
            # Build, so the next SOURCES.txt covers it (this settles after one
            # run: the names come straight from feeds.conf.default, which is
            # what 'Record source revisions' walks).
            echo "::warning::$name is not in $tag's SOURCES.txt - cannot verify it; build"
            changed=true
            continue
          fi
          if [ "$recorded" != "$sha" ]; then
            echo "$name moved: $recorded -> $sha (released as $tag)"
            changed=true
          fi
        done < .commitHash_All

        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        if [ "$changed" = 'false' ]; then
          echo "upstream is unchanged since $tag; not dispatching a build"
        fi

  dispatch:
    name: Ask for a build
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # repository_dispatch needs contents: write; nothing else in this job writes.
    permissions:
      contents: write
    steps:
    - name: Trigger build
      env:
        # A repository_dispatch sent with GITHUB_TOKEN is one of the two events
        # (with workflow_dispatch) that still starts a new workflow run, so no
        # personal access token is needed.
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh api --method POST "repos/$GH_REPO/dispatches" -f event-type=openwrt_source_update

  housekeeping:
    name: Prune runs and releases
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    # This repository's own script replaces Mattraks/delete-workflow-runs: one
    # less third-party action holding a token with actions: write, and the same
    # policy as the build workflow.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Delete every run but the three newest
      run: bash scripts/prune-runs.sh 3

    - name: Remove old Releases
      run: |
        set -euo pipefail
        # Same policy as the build workflow: ignore drafts; keep the newest KEEP
        # releases, then delete (including tags) releases older than MAX_DAYS
        # days or with fewer than KEEP_MIN downloads, when both are non-zero.
        REPO="${{ github.repository }}"
        KEEP=5
        KEEP_MIN=2
        MAX_DAYS=60
        RAW=$(gh api --paginate "repos/${REPO}/releases")
        DATA=$(echo "$RAW" | jq -s 'flatten(1)')
        COUNT=$(echo "$DATA" | jq 'length')
        if [ "${COUNT:-0}" -eq 0 ]; then
          echo "No releases."
          exit 0
        fi
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          tag=$(echo "$line" | jq -r '.tag')
          echo "Deleting release + tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
        done < <(echo "$DATA" | jq -c --argjson keep "$KEEP" --argjson kmin "$KEEP_MIN" --argjson md "$MAX_DAYS" '
          [.[] | select(.draft == false and (.published_at | type == "string"))]
          | sort_by(.published_at) | reverse
          | map({
              tag: .tag_name,
              published_at: .published_at,
              dl: ([.assets[]? | .download_count // 0] | add)
            })
          | .[$keep:]
          | map(. + { days: (((now - (.published_at | fromdateiso8601)) / 86400) | floor) })
          | map(select(.dl < $kmin or .days > $md))
          | .[]
        ')
