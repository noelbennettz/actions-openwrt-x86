# Description: Build official OpenWrt using GitHub Actions
#
# Every third-party action is pinned by the full commit SHA it resolved to,
# with the release tag in a trailing comment. A tag can be moved by its owner;
# a commit SHA cannot, so a run can only ever execute the code that was
# reviewed here. Dependabot (.github/dependabot.yml) keeps the pins current.
#

name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_commit:
        # Reproducing a release: copy the sha of the 'openwrt' line of its
        # SOURCES.txt. Empty means the head of REPO_BRANCH at build time.
        description: 'openwrt/openwrt commit to build (40 hex chars, empty = branch head)'
        required: false
        default: ''
      feed_commit:
        # Same idea for the seven feeds: copy the '<name> <ref> <sha> <url>'
        # lines of SOURCES.txt into 'name=sha' pairs.
        description: 'Feed pins as name=sha pairs, space separated (empty = feed branch heads)'
        required: false
        default: ''

env:
  REPO_URL: https://github.com/openwrt/openwrt
  # Official source branch. 25.12 is required because its Go toolchain is 1.26 and
  # the current passwall packages need it (sing-box >= 1.25.5, hysteria >= 1.26,
  # geoview >= 1.25). The 24.10 branch only ships Go 1.23 and cannot build them.
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    # The build itself only reads the repository. Writing to it happens in the
    # release and prune jobs below, so a compromised build step cannot create,
    # delete or overwrite anything.
    permissions:
      contents: read
      # actions/attest-build-provenance signs with the job's OIDC token and
      # stores the statement as a repository attestation.
      id-token: write
      attestations: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      dl_cache_key: ${{ steps.dlcache.outputs.key }}

    steps:
    - name: Checkout main-repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: main-repo

    # ---- CI environment setup below (nothing to do with firmware contents) ----
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Check free space
      run: df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        # Official OpenWrt build dependencies (Ubuntu 24.04)
        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
          unzip zlib1g-dev file wget quilt time xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Resolve the source revision
      id: source
      env:
        SOURCE_COMMIT: ${{ github.event.inputs.source_commit }}
      run: |
        set -euo pipefail
        if [ -n "$SOURCE_COMMIT" ]; then
          sha=$SOURCE_COMMIT
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full 40-character commit SHA (got '$sha')"
            exit 1
          fi
          echo "building the requested commit $sha"
        else
          sha=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve refs/heads/$REPO_BRANCH of $REPO_URL"
            exit 1
          fi
          echo "building the head of $REPO_BRANCH: $sha"
        fi
        echo "OPENWRT_COMMIT=$sha" >> "$GITHUB_ENV"

    - name: Clone source code
      run: |
        set -euo pipefail
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        # Check out the revision resolved above instead of whatever the branch
        # head is at clone time: everything recorded in SOURCES.txt and shipped
        # in the release has to be the tree that was actually compiled.
        git -C openwrt checkout --detach "$OPENWRT_COMMIT"
        actual=$(git -C openwrt rev-parse HEAD)
        if [ "$actual" != "$OPENWRT_COMMIT" ]; then
          echo "::error::checked out $actual, expected $OPENWRT_COMMIT"
          exit 1
        fi
        mkdir -p openwrt/dl

    # ---- Build acceleration caches (dl downloads + ccache/staging) ----
    # Pure CI speed-up, not firmware contents, safe to drop.
    - name: Set dl cache key
      id: dlcache
      run: |
        key="openwrt-dl-${{ hashFiles('main-repo/.diffconfig') }}"
        echo "DL_CACHE_KEY=$key" >> "$GITHUB_ENV"
        # The prune job needs this to know which dl cache to keep.
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Cache dl
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: openwrt/dl
        key: ${{ env.DL_CACHE_KEY }}
        restore-keys: |
          openwrt-dl-

    # klever1988/cachewrtbuild has no tags at all, so the pin is the commit
    # that "main" resolved to when this line was written; Dependabot cannot
    # track a repository without releases, so it has to be bumped by hand.
    - name: Cache
      uses: klever1988/cachewrtbuild@b729f807837dbc3455d02fd35192660d9b662121 # main, 2024-11-15
      with:
        ccache: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      working-directory: openwrt
      run: |
        if [ -e "../main-repo/$FEEDS_CONF" ]; then
          mv "../main-repo/$FEEDS_CONF" feeds.conf.default
        fi
        chmod +x "../main-repo/$DIY_P1_SH"
        "../main-repo/$DIY_P1_SH"

    - name: Update feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    # Feeds are cloned from their branch heads by 'feeds update', so a rerun
    # would otherwise pick up whatever moved upstream. feed_commit makes that
    # deterministic: 'name=sha' pairs, copied from the SOURCES.txt of the
    # release that is being reproduced.
    - name: Pin feeds to the requested revisions
      working-directory: openwrt
      env:
        FEED_COMMIT: ${{ github.event.inputs.feed_commit }}
      run: |
        set -euo pipefail
        if [ -z "${FEED_COMMIT:-}" ]; then
          echo "no feed_commit given; building the feed branch heads"
          exit 0
        fi
        for pair in $FEED_COMMIT; do
          name=${pair%%=*}
          sha=${pair#*=}
          if [ "$name" = "$pair" ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$pair' is not a name=sha pair (sha must be 40 hex chars)"
            exit 1
          fi
          if [ ! -d "feeds/$name/.git" ]; then
            echo "::error::feeds/$name does not exist; check the name against feeds.conf.default"
            exit 1
          fi
          git -C "feeds/$name" checkout --detach "$sha"
          actual=$(git -C "feeds/$name" rev-parse HEAD)
          if [ "$actual" != "$sha" ]; then
            echo "::error::feeds/$name is at $actual, expected $sha"
            exit 1
          fi
          echo "pinned feeds/$name to $sha"
        done

    - name: Install feeds
      working-directory: openwrt
      run: ./scripts/feeds install -a

    - name: Load custom configuration
      working-directory: openwrt
      run: |
        if [ -e ../main-repo/files ]; then
          mv ../main-repo/files files
        fi
        if [ -e "../main-repo/$CONFIG_FILE" ]; then
          mv "../main-repo/$CONFIG_FILE" .config
        fi
        chmod +x "../main-repo/$DIY_P2_SH"
        "../main-repo/$DIY_P2_SH"

    # There is deliberately no interactive-session step here. The former
    # P3TERX/ssh2actions (tmate) path handed anyone who could start a run - or
    # read the session URL out of the log - a shell with the job token. It is
    # gone rather than gated: proper gating would need a deployment environment
    # with required reviewers, which is a repository setting this workflow
    # cannot create.

    - name: Prepare config
      working-directory: openwrt
      run: make defconfig

    - name: Download packages
      working-directory: openwrt
      run: make download -j"$(nproc)"

    - name: Compile the firmware
      working-directory: openwrt
      id: compile
      run: |
        echo "compiling with $(nproc) jobs"
        # Keep the full log and surface the first failing package as an ::error::
        # annotation, so a failure can be diagnosed without downloading the log.
        report_failure() {
          local log="$1" line ctx hits
          echo "=== error context ==="
          # OpenWrt prints "ERROR: <package> failed to build." *after* the failing
          # recipe, so show the ~80 lines that precede that summary instead of the
          # generic "...toplevel.mk: world] Error 1" that grep -m1 would land on.
          line=$(grep -n -m1 '^ERROR: .* failed to build\.' "$log" | cut -d: -f1)
          if [ -n "$line" ]; then
            ctx=$(sed -n "$(( line > 80 ? line - 80 : 1 )),$(( line + 2 ))p" "$log")
          else
            ctx=$(grep -n -m1 -B20 -A40 -E 'Error [0-9]|error:' "$log" || tail -n 120 "$log")
          fi
          printf '%s\n' "$ctx"
          # These messages name the culprit but carry neither "Error <n>" nor
          # "error:", so the anchor above cannot see them. They must be line
          # anchored: with V=s every other kmod package's *recipe* is echoed too,
          # and that text contains 'echo "ERROR: module ... is missing."'.
          hits=$(grep -m5 -B2 -A6 -E "^ERROR: module '[^']*' is missing|^make\[[0-9]+\]: \*\*\* No rule to make target|^WARNING: kmod-[^ ]* is not available" "$log" || true)
          if [ -n "$hits" ]; then
            echo "=== kmod hits ==="
            printf '%s\n' "$hits"
          fi
          echo "::error::compile failed: $(printf '%s\n%s' "$hits" "$ctx" | tr '\n' ' ' | cut -c1-3000)"
        }
        # Rebuild only the package OpenWrt named in "ERROR: <pkg> failed to build."
        # with V=sc -j1: the toolchain and the kernel are already built, so this
        # finishes in a minute and prints the failing recipe without -j interleaving.
        focused_retry() {
          local log="$1" pkg out rc=0
          pkg=$(grep -m1 -o 'ERROR: package/[^ ]* failed to build' "$log" | sed 's/^ERROR: //; s/ failed to build$//' || true)
          [ -n "$pkg" ] || return 1
          out=/tmp/pkg.log
          echo "=== focused: make $pkg/compile V=sc -j1 ==="
          make "$pkg/compile" V=sc -j1 > "$out" 2>&1 || rc=$?
          tail -n 60 "$out"
          [ "$rc" -ne 0 ] && echo "::error::focused $pkg: $(tail -n 60 "$out" | tr '\n' ' ' | cut -c1-3000)"
          return "$rc"
        }
        make -j"$(nproc)" 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          report_failure /tmp/build.log
          # Cheap first: rebuild only the failing package verbosely (-j1 so the
          # recipe is not interleaved away). If that already fails we are done in
          # about a minute; only a *transient* failure falls through to a full
          # -j1 retry of the whole build.
          if focused_retry /tmp/build.log; then
            echo "=== focused build passed, retrying the whole build with -j1 V=s ==="
            make -j1 V=s 2>&1 | tee /tmp/build-vs.log
            rc=${PIPESTATUS[0]}
            cat /tmp/build-vs.log >> /tmp/build.log
            [ "$rc" -ne 0 ] && { report_failure /tmp/build-vs.log; exit "$rc"; }
          else
            exit "$rc"
          fi
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Record source revisions
      if: steps.compile.outputs.status == 'success' && !cancelled()
      working-directory: openwrt
      run: |
        set -euo pipefail
        # GPL-2.0: the image is an aggregate of the kernel, the build system and
        # the packages, so the release has to say which source it came from.
        # One line per repository: name, branch/ref, commit, URL. The file is
        # copied into the asset directory below, shipped with the image and
        # quoted in the release notes, so it is the machine-readable half of the
        # source offer.
        #
        # The commit recorded for OpenWrt is the one the tree is actually on
        # (checked below against the resolved revision), not whatever the branch
        # was when the run started: SOURCES.txt has to describe the compiled
        # tree, otherwise the offer is wrong.
        feed_ref() {
          # 'src-git name url[;branch]' -> the branch, empty when not given.
          awk -v n="$1" '$1 == "src-git" && $2 == n { print $3 }' feeds.conf.default |
            sed -n 's/.*;\(.*\)$/\1/p'
        }
        feed_url() {
          awk -v n="$1" '$1 == "src-git" && $2 == n { print $3 }' feeds.conf.default |
            sed 's/;.*$//'
        }

        {
          printf 'openwrt %s %s %s\n' \
            "$REPO_BRANCH" "$(git rev-parse HEAD)" "$REPO_URL"
          for d in feeds/*/; do
            [ -d "$d/.git" ] || continue
            name=${d%/}
            name=${name#feeds/}
            ref=$(feed_ref "$name")
            printf '%s %s %s %s\n' \
              "$name" "${ref:--}" "$(git -C "$d" rev-parse HEAD)" "$(feed_url "$name")"
          done
          printf 'build-config %s %s https://github.com/%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
        } > SOURCES.txt
        cat SOURCES.txt

        # What was recorded has to be what is checked out, otherwise the offer
        # does not match the binary.
        recorded=$(awk '$1 == "openwrt" { print $3 }' SOURCES.txt)
        if [ "$recorded" != "$(git rev-parse HEAD)" ] || [ "$recorded" != "$OPENWRT_COMMIT" ]; then
          echo "::error::SOURCES.txt records $recorded, the tree is on $(git rev-parse HEAD), the run resolved $OPENWRT_COMMIT"
          exit 1
        fi
        for d in feeds/*/; do
          [ -d "$d/.git" ] || continue
          name=${d%/}
          name=${name#feeds/}
          recorded=$(awk -v n="$name" '$1 == n { print $3 }' SOURCES.txt)
          if [ "$recorded" != "$(git -C "$d" rev-parse HEAD)" ]; then
            echo "::error::$name: SOURCES.txt records $recorded, the tree is on $(git -C "$d" rev-parse HEAD)"
            exit 1
          fi
        done

        # How to rebuild exactly this tree, printed into the run log and copied
        # into the release notes below.
        {
          printf 'source_commit=%s\n' "$OPENWRT_COMMIT"
          printf 'feed_commit='
          awk '$1 != "openwrt" && $1 != "build-config" { printf "%s=%s ", $1, $3 }' SOURCES.txt
          printf '\n'
        } > REPRODUCE.txt
        cat REPRODUCE.txt

    - name: Organize files
      working-directory: openwrt
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd bin/targets/*/*/
        rm -rf packages
        # SOURCES.txt is written by 'Record source revisions' into the openwrt
        # checkout root (working-directory: openwrt), i.e. three levels above the
        # target dir *including* the cwd itself - '../../../SOURCES.txt' resolves
        # to openwrt/bin/SOURCES.txt and failed, which silently left FIRMWARE
        # unset and killed the release upload. Anchor it on $GITHUB_WORKSPACE so
        # the path no longer depends on how deep bin/targets/... happens to be.
        cp "$GITHUB_WORKSPACE/openwrt/SOURCES.txt" .
        cp "$GITHUB_WORKSPACE/openwrt/REPRODUCE.txt" .
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    # Package versions and licences need the build tree (manifest, package
    # manager database), so they are collected here, while it still exists.
    - name: Record package versions and licences
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: bash main-repo/scripts/image-inventory.sh "$FIRMWARE" openwrt

    # SPDX SBOM of the release directory: the images and the inventories, each
    # with its hash. syft is pinned by version - the action downloads exactly
    # that release.
    - name: Generate SPDX SBOM
      if: steps.organize.outputs.status == 'success' && !cancelled()
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: ${{ env.FIRMWARE }}
        format: spdx-json
        output-file: ${{ env.FIRMWARE }}/sbom.spdx.json
        syft-version: v1.57.2
        upload-artifact: false
        upload-release-assets: false
        dependency-snapshot: false
        # The workflow token is only used to avoid the anonymous rate limit of
        # the releases API when resolving syft; nothing is written with it.
        github-token: ${{ github.token }}

    # Last, so the list covers every file the release carries, the SBOM
    # included. Sorted, and SHA256SUMS excludes itself.
    - name: Generate SHA256SUMS
      if: steps.organize.outputs.status == 'success' && !cancelled()
      working-directory: ${{ env.FIRMWARE }}
      run: |
        set -euo pipefail
        # Collect first, then hash: hashing inside the same pipeline that
        # writes SHA256SUMS makes shellcheck (rightly) nervous about reading
        # and writing the directory listing in one go.
        mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS \
          -printf '%f\n' | sort)
        sha256sum -- "${files[@]}" > SHA256SUMS
        cat SHA256SUMS

    # GitHub's own build provenance: a signed statement binding the files to
    # this workflow run, commit and inputs. No cosign key and no secret - the
    # signing identity is the workflow's OIDC token.
    # Verify with: gh attestation verify <file> -R <owner>/<repo>
    - name: Attest the firmware files
      if: steps.organize.outputs.status == 'success' && !cancelled()
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ env.FIRMWARE }}/*

    - name: Upload firmware directory
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      working-directory: openwrt
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        touch release.txt
        echo "release_tag=OpenWrt_${REPO_BRANCH}_$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
        # 'git log --pretty=format:' writes no trailing newline, so each non-empty
        # block is followed by a blank line; empty feeds are skipped entirely, which
        # keeps release.txt empty when nothing changed in the last 24 hours.
        add_log() {
          local out
          out=$("$@" 2>/dev/null || true)
          if [ -n "$out" ]; then printf '%s\n\n' "$out" >> release.txt; fi
        }
        add_log git log --pretty=format:"%s(#By %an)" --graph --since=24.hour
        # Walk every feed the build actually cloned instead of a hard-coded
        # list: video and the two Passwall feeds used to be missing here, so
        # their changes never showed up in the release notes.
        for d in feeds/*/; do
          [ -d "${d}.git" ] || continue
          add_log git -C "$d" log --pretty=format:"%s(#By %an)" \
            --graph --since=24.hour
        done

        test ! -s release.txt && echo "* The source code is not updated." >> release.txt
        sed -i '1i ## Firmware Update Log' release.txt
        # GPL-2.0: attach the source offer to the release notes. SOURCES.txt is
        # written by the 'Record source revisions' step and copied next to the
        # image, so the revisions travel with the firmware. Written with printf
        # instead of a heredoc: a heredoc body cannot be indented inside a
        # 'run: |' block, and a quoted heredoc is needed to keep the file names
        # literal.
        {
          printf '\n## Source\n\n'
          printf 'OpenWrt %s plus the feeds pinned in SOURCES.txt (attached);\n' \
            "$REPO_BRANCH"
          printf 'build configuration: .diffconfig in the repository at %s\n' \
            "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          printf '\n### Reproducing this build\n\n'
          printf 'Run **Build OpenWrt** with these two inputs (SOURCES.txt carries\n'
          printf 'the same revisions, one repository per line):\n\n'
          # Four-space indent instead of a fenced block: no backticks in a
          # single-quoted printf (shellcheck SC2016).
          sed 's/^/    /' REPRODUCE.txt
          printf '\n'
          printf '\n## Verifying the download\n\n'
          printf 'SHA256SUMS covers every file of this release, sbom.spdx.json is the\n'
          printf 'SPDX SBOM of the same files, PACKAGES.txt lists the package versions\n'
          printf 'and NOTICES.txt the licence inventory. The files also carry a GitHub\n'
          printf 'artifact attestation for this workflow run:\n\n'
          printf '    gh attestation verify <downloaded-file> -R %s\n' \
            "$GITHUB_REPOSITORY"
        } >> release.txt
        # Into the firmware directory, so the release job gets the notes with
        # the artifact instead of regenerating them (it has no OpenWrt tree).
        cp release.txt "$FIRMWARE/release.txt"
        echo "status=success" >> "$GITHUB_OUTPUT"

  release:
    name: Publish the release
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job allowed to write to the repository.
    permissions:
      contents: write
    steps:
    - name: Download the firmware artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: OpenWrt_firmware*
        merge-multiple: true
        path: firmware

    - name: Upload firmware to release
      env:
        # The built-in token is enough: this job grants contents: write, so no
        # PAT has to exist for the release upload.
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.build.outputs.release_tag }}
      run: |
        set -uo pipefail
        FIRMWARE="$PWD/firmware"
        if [ ! -d "$FIRMWARE" ]; then
          echo "::error::the firmware artifact was not downloaded into $FIRMWARE"
          exit 1
        fi
        # release.txt rides along with the artifact; it is the notes, not an
        # asset, so move it out of the directory that gets uploaded.
        NOTES="$RUNNER_TEMP/release.txt"
        if [ -f "$FIRMWARE/release.txt" ]; then
          mv "$FIRMWARE/release.txt" "$NOTES"
        else
          printf 'Release %s\n' "$TAG" > "$NOTES"
        fi
        ls -la "$FIRMWARE"
        echo "tag         : $TAG"
        echo "notes       : $NOTES"
        gh auth status 2>&1 || true
        # 'gh release create' occasionally dies with transient API errors (the
        # previous action-gh-release attempt failed with "Too many retries."),
        # so retry the whole operation a few times before giving up.
        for i in $(seq 1 5); do
          echo "=== release attempt $i"
          if out=$(gh release create "$TAG" --title "$TAG" \
                     --notes-file "$NOTES" "$FIRMWARE"/* 2>&1); then
            echo "release $TAG created"
            echo "$out"
            exit 0
          fi
          echo "$out"
          echo "::error::release attempt $i failed: $(echo "$out" | tr '\n' ' ' | cut -c1-600)"
          # if the release exists already, just (re)upload the assets
          if gh release view "$TAG" > /dev/null 2>&1; then
            if out=$(gh release upload "$TAG" "$FIRMWARE"/* --clobber 2>&1); then
              echo "assets uploaded to existing release $TAG"
              echo "$out"
              exit 0
            fi
            echo "$out"
            echo "::error::asset upload attempt $i failed: $(echo "$out" | tr '\n' ' ' | cut -c1-600)"
          fi
          sleep 15
        done
        echo "ERROR: giving up on release upload after 5 attempts" >&2
        exit 1

  prune:
    name: Housekeeping (caches, runs, artifacts, releases)
    needs: [ build, release ]
    # Only after a successful build: a failed run must not throw away the
    # caches the last successful one wrote. A failed *release* still prunes.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Writing is scoped to this job: cache and run deletion need actions:
    # write, release deletion needs contents: write.
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DL_CACHE_KEY: ${{ needs.build.outputs.dl_cache_key }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: main-repo

    - name: Prune old Actions caches
      run: |
        set -euo pipefail
        REPO="$GITHUB_REPOSITORY"
        DATA=$(gh cache list -R "$REPO" --limit 100 --json id,key,createdAt)
        echo "$DATA" | jq -r '.[] | "\(.createdAt) \(.id) \(.key)"'

        delete_ids=$(echo "$DATA" | jq -r --arg dl "${DL_CACHE_KEY:-}" '
          ( [.[] | select(.key | startswith("cache-openwrt"))] | map(.id) )
          +
          ( [.[] | select((.key | startswith("openwrt-dl-")) and .key != $dl)] | map(.id) )
          +
          ( [.[] | select(.key | startswith("HEAD-"))] | sort_by(.createdAt) | reverse | .[2:] | map(.id) )
          | .[]
        ')
        for id in $delete_ids; do
          echo "Deleting cache id=$id"
          gh cache delete "$id" -R "$REPO" || true
        done

    - name: Delete every run but the three newest
      run: bash main-repo/scripts/prune-runs.sh 3

    - name: Delete artifacts older than 30 days
      run: bash main-repo/scripts/prune-artifacts.sh 30

    - name: Keep the five newest releases
      run: |
        set -euo pipefail
        REPO="$GITHUB_REPOSITORY"
        KEEP=5
        i=0
        while IFS= read -r tag; do
          if [ "$i" -ge "$KEEP" ]; then
            echo "Deleting release (and tag): $tag"
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
          fi
          i=$((i + 1))
        done < <(gh api "repos/${REPO}/releases" --paginate --jq '.[] | .tag_name')
