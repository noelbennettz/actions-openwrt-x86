name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  # Official source branch. 25.12 is required because its Go toolchain is 1.26 and
  # the current passwall packages need it (sing-box >= 1.25.5, hysteria >= 1.26,
  # geoview >= 1.25). The 24.10 branch only ships Go 1.23 and cannot build them.
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout main-repo
      uses: actions/checkout@v5
      with:
        path: main-repo

    # ---- CI environment setup below (nothing to do with firmware contents) ----
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Check free space
      run: df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        # Official OpenWrt build dependencies (Ubuntu 24.04)
        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
          unzip zlib1g-dev file wget quilt time xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        mkdir -p openwrt/dl

    # ---- Build acceleration caches (dl downloads + ccache/staging) ----
    # Pure CI speed-up, not firmware contents, safe to drop.
    - name: Set dl cache key
      run: echo "DL_CACHE_KEY=openwrt-dl-${{ hashFiles('main-repo/.diffconfig') }}" >> "$GITHUB_ENV"

    - name: Cache dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: ${{ env.DL_CACHE_KEY }}
        restore-keys: |
          openwrt-dl-

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      working-directory: openwrt
      run: |
        if [ -e "../main-repo/$FEEDS_CONF" ]; then
          mv "../main-repo/$FEEDS_CONF" feeds.conf.default
        fi
        chmod +x "../main-repo/$DIY_P1_SH"
        "../main-repo/$DIY_P1_SH"

    - name: Update feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: openwrt
      run: ./scripts/feeds install -a

    - name: Load custom configuration
      working-directory: openwrt
      run: |
        if [ -e ../main-repo/files ]; then
          mv ../main-repo/files files
        fi
        if [ -e "../main-repo/$CONFIG_FILE" ]; then
          mv "../main-repo/$CONFIG_FILE" .config
        fi
        chmod +x "../main-repo/$DIY_P2_SH"
        "../main-repo/$DIY_P2_SH"

    # ---- Debug only: workflow_dispatch with ssh=true opens a tmate session ----
    # Not part of the upstream template, safe to drop.
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Prepare config
      working-directory: openwrt
      run: make defconfig

    - name: Download packages
      working-directory: openwrt
      run: make download -j"$(nproc)"

    - name: Compile the firmware
      working-directory: openwrt
      id: compile
      run: |
        echo "compiling with $(nproc) jobs"
        # Keep the full log and surface the first failing package as an ::error::
        # annotation, so a failure can be diagnosed without downloading the log.
        report_failure() {
          local log="$1" line ctx hits
          echo "=== error context ==="
          # OpenWrt prints "ERROR: <package> failed to build." *after* the failing
          # recipe, so show the ~80 lines that precede that summary instead of the
          # generic "...toplevel.mk: world] Error 1" that grep -m1 would land on.
          line=$(grep -n -m1 '^ERROR: .* failed to build\.' "$log" | cut -d: -f1)
          if [ -n "$line" ]; then
            ctx=$(sed -n "$(( line > 80 ? line - 80 : 1 )),$(( line + 2 ))p" "$log")
          else
            ctx=$(grep -n -m1 -B20 -A40 -E 'Error [0-9]|error:' "$log" || tail -n 120 "$log")
          fi
          printf '%s\n' "$ctx"
          # These messages name the culprit but carry neither "Error <n>" nor
          # "error:", so the anchor above cannot see them. They must be line
          # anchored: with V=s every other kmod package's *recipe* is echoed too,
          # and that text contains 'echo "ERROR: module ... is missing."'.
          hits=$(grep -m5 -B2 -A6 -E "^ERROR: module '[^']*' is missing|^make\[[0-9]+\]: \*\*\* No rule to make target|^WARNING: kmod-[^ ]* is not available" "$log" || true)
          if [ -n "$hits" ]; then
            echo "=== kmod hits ==="
            printf '%s\n' "$hits"
          fi
          echo "::error::compile failed: $(printf '%s\n%s' "$hits" "$ctx" | tr '\n' ' ' | cut -c1-3000)"
        }
        # Rebuild only the package OpenWrt named in "ERROR: <pkg> failed to build."
        # with V=sc -j1: the toolchain and the kernel are already built, so this
        # finishes in a minute and prints the failing recipe without -j interleaving.
        focused_retry() {
          local log="$1" pkg out rc=0
          pkg=$(grep -m1 -o 'ERROR: package/[^ ]* failed to build' "$log" | sed 's/^ERROR: //; s/ failed to build$//' || true)
          [ -n "$pkg" ] || return 1
          out=/tmp/pkg.log
          echo "=== focused: make $pkg/compile V=sc -j1 ==="
          make "$pkg/compile" V=sc -j1 > "$out" 2>&1 || rc=$?
          tail -n 60 "$out"
          [ "$rc" -ne 0 ] && echo "::error::focused $pkg: $(tail -n 60 "$out" | tr '\n' ' ' | cut -c1-3000)"
          return "$rc"
        }
        make -j$(nproc) 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          report_failure /tmp/build.log
          # Cheap first: rebuild only the failing package verbosely (-j1 so the
          # recipe is not interleaved away). If that already fails we are done in
          # about a minute; only a *transient* failure falls through to a full
          # -j1 retry of the whole build.
          if focused_retry /tmp/build.log; then
            echo "=== focused build passed, retrying the whole build with -j1 V=s ==="
            make -j1 V=s 2>&1 | tee /tmp/build-vs.log
            rc=${PIPESTATUS[0]}
            cat /tmp/build-vs.log >> /tmp/build.log
            [ "$rc" -ne 0 ] && { report_failure /tmp/build-vs.log; exit "$rc"; }
          else
            exit "$rc"
          fi
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      working-directory: openwrt
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      working-directory: openwrt
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        touch release.txt
        echo "release_tag=OpenWrt_${REPO_BRANCH}_$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
        # 'git log --pretty=format:' writes no trailing newline, so each non-empty
        # block is followed by a blank line; empty feeds are skipped entirely, which
        # keeps release.txt empty when nothing changed in the last 24 hours.
        add_log() {
          local out
          out=$("$@" 2>/dev/null || true)
          if [ -n "$out" ]; then printf '%s\n\n' "$out" >> release.txt; fi
        }
        add_log git log --pretty=format:"%s(#By %an)" --graph --since=24.hour
        for feed in packages luci routing telephony; do
          add_log git -C "feeds/$feed" log --pretty=format:"%s(#By %an)" \
            --graph --since=24.hour
        done

        test ! -s release.txt && echo "* The source code is not updated." >> release.txt
        sed -i '1i ## Firmware Update Log' release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        # The built-in github.token is used as a fallback: prefer the PAT so the
        # step also works if the repository restricts the default token to read.
        GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT != '' && secrets.ACTIONS_TRIGGER_PAT || secrets.GITHUB_TOKEN }}
        # The checkout lives in ./main-repo, so the workspace root is NOT a git
        # repository and 'gh' cannot infer the target repo from it
        # ("failed to run git: fatal: not a git repository"). GH_REPO fixes that
        # without changing the working directory, which would break the
        # relative path of openwrt/release.txt.
        GH_REPO: ${{ github.repository }}
        TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        set -uo pipefail
        # 'gh release create' occasionally dies with transient API errors (the
        # previous action-gh-release attempt failed with "Too many retries."),
        # so retry the whole operation a few times before giving up.
        echo "target dir : ${FIRMWARE:-<unset>}"
        echo "tag         : $TAG"
        ls -la "${FIRMWARE:-/nonexistent}" || true
        gh auth status 2>&1 || true
        for i in $(seq 1 5); do
          echo "=== release attempt $i"
          if out=$(gh release create "$TAG" --title "$TAG" \
                     --notes-file openwrt/release.txt "$FIRMWARE"/* 2>&1); then
            echo "release $TAG created"
            echo "$out"
            exit 0
          fi
          echo "$out"
          echo "::error::release attempt $i failed: $(echo "$out" | tr '\n' ' ' | cut -c1-600)"
          # if the release exists already, just (re)upload the assets
          if gh release view "$TAG" > /dev/null 2>&1; then
            if out=$(gh release upload "$TAG" "$FIRMWARE"/* --clobber 2>&1); then
              echo "assets uploaded to existing release $TAG"
              echo "$out"
              exit 0
            fi
            echo "$out"
            echo "::error::asset upload attempt $i failed: $(echo "$out" | tr '\n' ' ' | cut -c1-600)"
          fi
          sleep 15
        done
        echo "ERROR: giving up on release upload after 5 attempts" >&2
        exit 1

    # ---- CI housekeeping: prune old caches / runs / releases ----
    # Nothing to do with firmware contents.
    # NOTE: this must only run on success. A failed run (e.g. the release upload
    # after a finished compile) must not throw away the caches written by the last
    # successful build - the cache only affects build speed, never the artifacts.
    - name: Prune old Actions caches
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # NOTE: .diffconfig has been moved to openwrt/.config, so only the
        # DL_CACHE_KEY value captured above is usable here.
        REPO="${{ github.repository }}"
        DATA=$(gh cache list -R "$REPO" --limit 100 --json id,key,createdAt)
        echo "$DATA" | jq -r '.[] | "\(.createdAt) \(.id) \(.key)"'

        delete_ids=$(echo "$DATA" | jq -r --arg dl "${DL_CACHE_KEY:-}" '
          ( [.[] | select(.key | startswith("cache-openwrt"))] | map(.id) )
          +
          ( [.[] | select((.key | startswith("openwrt-dl-")) and .key != $dl)] | map(.id) )
          +
          ( [.[] | select(.key | startswith("HEAD-"))] | sort_by(.createdAt) | reverse | .[2:] | map(.id) )
          | .[]
        ')
        for id in $delete_ids; do
          echo "Deleting cache id=$id"
          gh cache delete "$id" -R "$REPO" || true
        done

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        KEEP=10
        i=0
        while IFS= read -r tag; do
          if [ "$i" -ge "$KEEP" ]; then
            echo "Deleting release (and tag): $tag"
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
          fi
          i=$((i + 1))
        done < <(gh api "repos/${REPO}/releases" --paginate --jq '.[] | .tag_name')
