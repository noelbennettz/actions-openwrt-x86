name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  # Official source branch: openwrt-24.10 is the stable release branch; use 'master' for snapshots
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .diffconfig
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout main-repo
      uses: actions/checkout@v5
      with:
        path: main-repo

    # ---- CI environment setup below (nothing to do with firmware contents) ----
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Check free space
      run: df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        # Official OpenWrt build dependencies (Ubuntu 24.04)
        sudo -E apt-get -qq install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
          unzip zlib1g-dev file wget quilt time xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        mkdir -p openwrt/dl

    # ---- Build acceleration caches (dl downloads + ccache/staging); not firmware customization, safe to drop ----
    - name: Set dl cache key
      run: echo "DL_CACHE_KEY=openwrt-dl-${{ hashFiles('main-repo/.diffconfig') }}" >> "$GITHUB_ENV"

    - name: Cache dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: ${{ env.DL_CACHE_KEY }}
        restore-keys: |
          openwrt-dl-

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        clean: 'false'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      working-directory: openwrt
      run: |
        if [ -e ../main-repo/$FEEDS_CONF ]; then
          mv ../main-repo/$FEEDS_CONF feeds.conf.default
        fi
        chmod +x ../main-repo/$DIY_P1_SH
        ../main-repo/$DIY_P1_SH

    - name: Update feeds
      working-directory: openwrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: openwrt
      run: ./scripts/feeds install -a

    - name: Load custom configuration
      working-directory: openwrt
      run: |
        if [ -e ../main-repo/files ]; then
          mv ../main-repo/files files
        fi
        if [ -e ../main-repo/$CONFIG_FILE ]; then
          mv ../main-repo/$CONFIG_FILE .config
        fi
        chmod +x ../main-repo/$DIY_P2_SH
        ../main-repo/$DIY_P2_SH

    # ---- Debug only: workflow_dispatch with ssh=true opens a tmate session (not in the upstream template, safe to drop) ----
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Prepare config
      working-directory: openwrt
      run: make defconfig

    - name: Download package
      working-directory: openwrt
      run: make download -j$(nproc)

    - name: Compile the firmware
      working-directory: openwrt
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        # On failure retry with the same job count and verbose logs instead of -j1,
        # which would spend the remaining hours recompiling and hit the 6h limit
        make -j$(nproc) || make -j$(nproc) V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v6
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      working-directory: openwrt
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      working-directory: openwrt
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        touch release.txt
        echo "release_tag=OpenWrt_${REPO_BRANCH}_$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
        git log --pretty=format:"%s(#By %an)" --graph --since=24.hour >> release.txt
        git -C feeds/packages log --pretty=format:"%s(#By %an)" --graph --since=24.hour >> release.txt || true
        git -C feeds/luci log --pretty=format:"%s(#By %an)" --graph --since=24.hour >> release.txt || true
        git -C feeds/routing log --pretty=format:"%s(#By %an)" --graph --since=24.hour >> release.txt || true
        git -C feeds/telephony log --pretty=format:"%s(#By %an)" --graph --since=24.hour >> release.txt || true

        test ! -s release.txt && echo -e "\n* The source code is not updated." >> release.txt
        sed -i '1i ## Firmware Update Log' release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        set -euo pipefail
        # 'gh release create' occasionally dies with transient API errors (the
        # previous action-gh-release attempt failed with "Too many retries."),
        # so retry the whole operation a few times before giving up.
        for i in $(seq 1 5); do
          echo "=== release attempt $i"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if gh release upload "$TAG" "$FIRMWARE"/* --clobber; then
              echo "assets uploaded to existing release $TAG"
              exit 0
            fi
          else
            if gh release create "$TAG" --title "$TAG" \
                 --notes-file openwrt/release.txt "$FIRMWARE"/*; then
              echo "release $TAG created"
              exit 0
            fi
          fi
          sleep 15
        done
        echo "ERROR: giving up on release upload after 5 attempts" >&2
        exit 1

    # ---- CI housekeeping: prune old caches / runs / releases (nothing to do with firmware contents) ----
    - name: Prune old Actions caches
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # NOTE: .diffconfig has been moved to openwrt/.config, so only DL_CACHE_KEY captured above is usable here
        REPO="${{ github.repository }}"
        DATA=$(gh cache list -R "$REPO" --limit 100 --json id,key,createdAt)
        echo "$DATA" | jq -r '.[] | "\(.createdAt) \(.id) \(.key)"'

        delete_ids=$(echo "$DATA" | jq -r --arg dl "${DL_CACHE_KEY:-}" '
          ( [.[] | select(.key | startswith("cache-openwrt"))] | map(.id) )
          +
          ( [.[] | select((.key | startswith("openwrt-dl-")) and .key != $dl)] | map(.id) )
          +
          ( [.[] | select(.key | startswith("HEAD-"))] | sort_by(.createdAt) | reverse | .[2:] | map(.id) )
          | .[]
        ')
        for id in $delete_ids; do
          echo "Deleting cache id=$id"
          gh cache delete "$id" -R "$REPO" || true
        done

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 5

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        KEEP=10
        i=0
        while IFS= read -r tag; do
          if [ "$i" -ge "$KEEP" ]; then
            echo "Deleting release (and tag): $tag"
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO" || true
          fi
          i=$((i + 1))
        done < <(gh api "repos/${REPO}/releases" --paginate --jq '.[] | .tag_name')
