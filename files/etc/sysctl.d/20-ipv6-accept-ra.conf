# Accept Router Advertisements (SLAAC) even though IPv6 forwarding is enabled.
#
# OpenWrt's /etc/init.d/sysctl unconditionally sets accept_ra=0 on every interface
# at boot (a security default). Combined with net.ipv6.conf.all.forwarding=1 this
# means a WAN interface would never take an address from a Router Advertisement,
# so only DHCPv6 would work. This drop-in restores SLAAC on the WAN side while
# keeping DHCPv6/prefix delegation working as before.
#
#   0 = never accept RAs
#   1 = accept only when forwarding is disabled (kernel default)
#   2 = accept even when forwarding is enabled (what a router needs)
#
# "all" applies to the interfaces that already exist at boot, "default" is
# inherited by interfaces created later (VLANs, bridges, ...).
#
# If you do not want your LAN ports to accept RAs either, comment the "all" line
# and set accept_ra=2 only for the WAN device instead, e.g.:
#   net.ipv6.conf.eth1.accept_ra=2
net.ipv6.conf.all.accept_ra=2
net.ipv6.conf.default.accept_ra=2
